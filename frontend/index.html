<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="石佳弘的攝影作品集。做過不少事情、幹過不少鳥事，同時帶著各位到處走走，攝影這件事情總能把這些瞬間記錄下來。人像攝影 / 活動紀錄 / 旅行隨團攝影。"
    />
    <link rel="canonical" href="https://pageproject.pageworker.workers.dev/" />

    <!--
      OG 圖固定用 1200x630 的 JPEG：各家社群平台對 WebP 支援參差不齊，
      且 hero 原圖是 3:2，直接給會被各平台用不同方式裁掉、破壞構圖。
      圖片由 src/assets/hero.webp 裁切產生，見 commit 說明。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZHENDOKU" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="ZHENDOKU | 石佳弘 攝影作品集" />
    <meta
      property="og:description"
      content="石佳弘的攝影作品集。做過不少事情、幹過不少鳥事，同時帶著各位到處走走，攝影這件事情總能把這些瞬間記錄下來。人像攝影 / 活動紀錄 / 旅行隨團攝影。"
    />
    <meta property="og:url" content="https://pageproject.pageworker.workers.dev/" />
    <meta
      property="og:image"
      content="https://pageproject.pageworker.workers.dev/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="夜晚街頭人群的黑白攝影作品" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZHENDOKU | 石佳弘 攝影作品集" />
    <meta
      name="twitter:description"
      content="石佳弘的攝影作品集。人像攝影 / 活動紀錄 / 旅行隨團攝影。"
    />
    <meta
      name="twitter:image"
      content="https://pageproject.pageworker.workers.dev/og-image.jpg"
    />
    <!--
      Hero 圖是 LCP 元素。放在 public/ 並在這裡預載，讓瀏覽器的 preload scanner
      一掃 HTML 就開始下載；若改回從 JS import，發現時機會延後到 bundle 解析完成之後。
    -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ZHENDOKU | 石佳弘 攝影作品集</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
